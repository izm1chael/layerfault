[package]
name = "layerfault-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Keep this cargo-fuzz project independent from the parent workspace while it
# uses the parent package through the explicit path dependency below.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
layerfault = { path = ".." }
tempfile = "3"

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

