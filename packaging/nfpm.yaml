# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: layerfault
arch: ${LAYERFAULT_PACKAGE_ARCH}
platform: linux
version: ${LAYERFAULT_PACKAGE_VERSION}
version_schema: semver
section: utils
priority: optional
maintainer: izm1chael
vendor: Layerfault
homepage: https://github.com/izm1chael/layerfault
license: MIT
description: Offline-first local AI model admission, provenance, package, runtime and behavioural security scanner
contents:
  - src: ${LAYERFAULT_PACKAGE_BINARY}
    dst: /usr/bin/layerfault
    expand: true
    file_info:
      mode: 0755
  - src: README.md
    dst: /usr/share/doc/layerfault/README.md
    file_info:
      mode: 0644
  - src: SECURITY.md
    dst: /usr/share/doc/layerfault/SECURITY.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/layerfault/LICENSE
    file_info:
      mode: 0644
  - src: scripts/install/active-runtime.sh
    dst: /usr/share/layerfault/install-active-runtime.sh
    file_info:
      mode: 0755
  - src: scripts/install/uninstall.sh
    dst: /usr/share/layerfault/uninstall.sh
    file_info:
      mode: 0755
  - src: packaging/active-requirements.txt
    dst: /usr/share/layerfault/active-requirements.txt
    file_info:
      mode: 0644
  - src: completions/layerfault.bash
    dst: /usr/share/bash-completion/completions/layerfault
    file_info:
      mode: 0644
  - src: completions/_layerfault
    dst: /usr/share/zsh/site-functions/_layerfault
    file_info:
      mode: 0644
  - src: completions/layerfault.fish
    dst: /usr/share/fish/vendor_completions.d/layerfault.fish
    file_info:
      mode: 0644
  - src: docs/man/layerfault.1
    dst: /usr/share/man/man1/layerfault.1
    file_info:
      mode: 0644
  - src: docs/INSTALL.md
    dst: /usr/share/doc/layerfault/INSTALL.md
    file_info:
      mode: 0644
  - src: docs/DISTRIBUTION.md
    dst: /usr/share/doc/layerfault/DISTRIBUTION.md
    file_info:
      mode: 0644
recommends:
  - ca-certificates
