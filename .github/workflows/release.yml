name: Release provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Release security gate
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          bash scripts/security-gates.sh
          python3 scripts/schema-gates.py --binary target/debug/layerfault

  native:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: layerfault-linux-x86_64
            source: target/release/layerfault
          - os: ubuntu-24.04-arm
            artifact: layerfault-linux-aarch64
            source: target/release/layerfault
          - os: windows-latest
            artifact: layerfault-windows-x86_64.exe
            source: target/release/layerfault.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Build
        run: cargo build --release --locked
      - name: Stage artifact, checksum and SBOM
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.source }}" "dist/${{ matrix.artifact }}"
          python3 scripts/cargo-sbom.py "dist/${{ matrix.artifact }}.sbom.cdx.json"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.artifact }}" "${{ matrix.artifact }}.sbom.cdx.json" > "${{ matrix.artifact }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.artifact }}" "${{ matrix.artifact }}.sbom.cdx.json" > "${{ matrix.artifact }}.sha256")
          fi
      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  linux-static:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain and musl
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build static Linux binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Stage
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/layerfault dist/layerfault-linux-x86_64-musl
          python3 scripts/cargo-sbom.py dist/layerfault-linux-x86_64-musl.sbom.cdx.json
          (cd dist && sha256sum layerfault-linux-x86_64-musl layerfault-linux-x86_64-musl.sbom.cdx.json > layerfault-linux-x86_64-musl.sha256)
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/layerfault-linux-x86_64-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layerfault-linux-x86_64-musl
          path: dist/

  macos-universal:
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both macOS architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/layerfault \
            target/x86_64-apple-darwin/release/layerfault \
            -output dist/layerfault-macos-universal
          lipo -info dist/layerfault-macos-universal
          python3 scripts/cargo-sbom.py dist/layerfault-macos-universal.sbom.cdx.json
          (cd dist && shasum -a 256 layerfault-macos-universal layerfault-macos-universal.sbom.cdx.json > layerfault-macos-universal.sha256)
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/layerfault-macos-universal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layerfault-macos-universal
          path: dist/


  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, linux-static, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-download release-assets
          mkdir -p release-download release-assets
          gh run download "$GITHUB_RUN_ID" --dir release-download
          find release-download -type f -print0 | while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -e "release-assets/$name" ]]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            cp "$file" "release-assets/$name"
          done
          test -n "$(find release-assets -type f -print -quit)"
      - name: Create GitHub release and attach verified build outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were assembled" >&2
            exit 1
          fi

          prerelease=()
          if [[ "$tag" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          notes=()
          if [[ "$tag" == *rc* && -f RELEASE_NOTES_RC1.md ]]; then
            notes+=(--notes-file RELEASE_NOTES_RC1.md)
          else
            notes+=(--generate-notes)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --title "Layerfault $tag" \
              "${prerelease[@]}" \
              "${notes[@]}"
          fi
