name: Fuzz smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nightly toolchain
        run: |
          rustup update nightly --no-self-update
          rustup default nightly
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Verify deterministic seed corpus
        run: |
          python3 scripts/corpus/generate-fuzz-corpus.py
          git diff --exit-code -- fuzz/corpus fuzz/CORPUS_INDEX.json
      - name: Run all fuzz targets against seeded corpora
        working-directory: fuzz
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(cargo +nightly fuzz list)
          [[ ${#targets[@]} -gt 0 ]]
          for target in "${targets[@]}"; do
            echo "::group::fuzz $target"
            dict_args=()
            if [[ -f "dictionaries/$target.dict" ]]; then
              dict_args+=("-dict=dictionaries/$target.dict")
            fi
            cargo +nightly fuzz run "$target" "corpus/$target" -- \
              -max_total_time=60 \
              -max_len=2097152 \
              -timeout=10 \
              -rss_limit_mb=4096 \
              -use_value_profile=1 \
              "${dict_args[@]}" \
              -print_final_stats=1
            echo "::endgroup::"
          done
