name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        shell: bash
        run: |
          rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked --all-targets

  clippy-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup show active-toolchain
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Shell/static contracts
        run: |
          bash -n create_poisoned_model.sh
          bash -n scripts/security/gates.sh
          bash -n scripts/corpus/adversarial-gate.sh
          python3 scripts/security/schema-gates.py
          python3 scripts/build/sbom.py /tmp/layerfault-sbom.cdx.json
          python3 -m json.tool /tmp/layerfault-sbom.cdx.json >/dev/null
      - name: Synthetic admission/security gate
        run: bash scripts/security/gates.sh

  dependency-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup show active-toolchain
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: RustSec audit
        run: cargo audit

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install declared MSRV
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: Check on MSRV
        run: cargo +1.88.0 check --locked --all-targets
      - name: Test on MSRV
        run: cargo +1.88.0 test --locked --all-targets

  fresh-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use repository toolchain
        run: rustup show active-toolchain
      - name: Build release binary
        run: cargo build --release --locked
      - name: Verify installation
        run: |
          ./target/release/layerfault --version
          ./target/release/layerfault selftest
          ./target/release/layerfault inspect fuzz/corpus/gguf/valid-v3-q4_0.gguf --json >/tmp/layerfault-inspection.json
