name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked --all-targets

  clippy-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Shell/static contracts
        run: |
          bash -n create_poisoned_model.sh
          bash -n scripts/security-gates.sh
          python3 scripts/schema-gates.py
          python3 scripts/cargo-sbom.py /tmp/layerfault-sbom.cdx.json
          python3 -m json.tool /tmp/layerfault-sbom.cdx.json >/dev/null
      - name: Synthetic admission/security gate
        run: bash scripts/security-gates.sh

  dependency-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: RustSec audit
        run: cargo audit
