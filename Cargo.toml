[workspace]
resolver = "2"
# fuzz/ and vendor/candelabra are deliberately NOT members: fuzz/ is its own
# standalone cargo-fuzz project (path-dependency back onto this package), and
# vendor/candelabra is a vendored third-party patch, not Layerfault source.
members = [
    ".",
    "helpers/layerfault-telemetry-protocol",
    "helpers/layerfault-ebpf-telemetry",
]

[package]
name = "layerfault"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.88"
authors = ["izm1chael"]
description = "Offline-first local AI model admission, provenance, package, and runtime security scanner"
license = "MIT"
repository = "https://github.com/izm1chael/layerfault"

[dependencies]
# Shared wire-protocol types (schema version, event enum, frame struct) with
# the optional eBPF telemetry helper in helpers/layerfault-ebpf-telemetry.
# Zero unsafe, kept as a separate crate so both this forbid(unsafe_code)
# crate and the helper (which needs unsafe for Aya) import a single
# hand-synced schema definition instead of duplicating it.
layerfault-telemetry-protocol = { path = "helpers/layerfault-telemetry-protocol" }
clap       = { version = "4.5",  features = ["derive"] }
serde      = { version = "1.0",  features = ["derive"] }
serde_json = "1.0"
sha2       = "0.11"
hex        = "0.4"
tempfile   = "3.27"
digest     = "0.11"
regex      = "1.10"
rayon      = "1.10"
comfy-table = "7.1"
colored    = "3.1"
indicatif  = "0.18.6"
walkdir    = "2.5"
zip        = { version = "8.6", default-features = false, features = ["deflate"] }
tar        = { version = "0.4", default-features = false }
flate2     = { version = "1.0", default-features = false, features = ["miniz_oxide"] }
anyhow     = "1.0"
lazy_static = "1.4"
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }
ed25519-dalek = { version = "3", features = ["pkcs8", "pem"] }
subtle = "2.6"
rustpython-parser = "0.4.0"
ctrlc = "3.4"


candelabra = "0.2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2.5"
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
postgres_rustls = "=0.1.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1.0"
tiny_http = "0.12"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "webpki-roots"] }
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# TOML parsing for pyproject.toml / poetry.lock / uv.lock: a data-only Value
# tree via toml::Value, no arbitrary type construction. No default features
# to disable beyond the parser itself.
toml = "0.8"
# Safe, tag-free, data-only YAML 1.1 parser for environment.yml / Conda
# lockfiles. Returns a plain Yaml enum (Array/Hash/String/Integer/Real/
# Boolean/Null/BadValue) with no arbitrary Rust type construction from YAML
# tags, matching the no-tags/no-object-construction requirement for
# untrusted manifest parsing. Chosen over serde_yaml, which is upstream
# maintenance-only.
yaml-rust2 = "0.11"

# JS/TS parser for `javascript_static`'s bounded AST-based capability
# analysis of untrusted `.js`/`.mjs`/`.cjs`/`.ts`/`.tsx`/`.jsx` package
# members. Chosen over `swc_ecma_parser`: MIT-licensed (matching this
# project's own MIT license, unlike swc's Apache-2.0 split across a sprawling
# multi-crate family) and a smaller, more coherent dependency surface for
# "parse then walk the AST" (oxc_allocator/oxc_ast/oxc_span/oxc_ast_visit
# only). Pure safe Rust, no `unsafe` required by this crate's public API, and
# produces a data-only AST with no arbitrary code execution during parsing.
# Pinned to 0.96.0, the newest release whose declared MSRV (1.88.0) still
# matches this project's own `rust-version`; newer oxc releases require a
# higher MSRV. `default-features = false` drops the `regular_expression`
# default feature (a full ECMA regex-syntax validator/AST), which this
# frontend does not need — it only classifies call targets and string-literal
# arguments, never regex literals.
oxc_parser = { version = "=0.96.0", default-features = false }
oxc_allocator = "=0.96.0"
oxc_ast = "=0.96.0"
oxc_span = "=0.96.0"
oxc_ast_visit = "=0.96.0"

[build-dependencies]
sha2 = "0.11"

# Layerfault has many integration-test crates and a large dependency graph.
# Full debug information makes every independently linked test executable
# hundreds of megabytes, while incremental test state adds several more GiB.
# Line tables retain useful panic backtraces without saturating local disks.
[profile.test]
debug = "line-tables-only"
incremental = false

# Vendored fork of candelabra 0.2.0 that disables its default native-tls/openssl-sys
# pulls (via hf-hub's "default-tls" feature and reqwest's default-tls feature) in favor
# of rustls, so a normal Linux build does not require libssl-dev/pkg-config.
# See vendor/candelabra/Cargo.toml for the exact feature diff against upstream.
[patch.crates-io]
candelabra = { path = "vendor/candelabra" }
